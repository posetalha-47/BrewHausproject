
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore the BrewHaus cafe gallery.">
  <title>Gallery | BrewHaus</title>
   <link rel="stylesheet" href="css/style.css">


<!-- Line 9 ko aise update karein -->
<script src="js/script.js" defer></script>
</head>
<body>
 
<header class="site-header">
    <div class="container navbar">

        <a href="./index.html" class="logo">Brew<span>Haus.</span></a>

        <button class="menu-toggle"
            type="button"
            aria-label="Open navigation menu"
            aria-expanded="false"
            aria-controls="main-navigation">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav id="main-navigation" class="navigation" aria-label="Main navigation">
            <a href="./index.html">Home</a>
            <a href="./menu.html">Our Menu</a>
            <a href="./gallery.html" aria-current="page">Gallery</a>
            <a href="./about.html">Our Story</a>
            <a href="./contact.html" class="nav-button">Visit Us</a>
        </nav>

    </div>
</header>


  <main class="gallery-page">
    <section class="gallery-heading">
      <p class="eyebrow">A LOOK INSIDE</p>
      <h1>Our Gallery</h1>
      <p>Discover the coffee, the atmosphere, and the little moments at BrewHaus.</p>
    </section>

    <section class="gallery-grid" aria-label="Cafe photo gallery">
      <button class="gallery-item" type="button" aria-label="View coffee photo">
        <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=900&q=80" alt="Freshly prepared cup of coffee">
      </button>
      <button class="gallery-item" type="button" aria-label="View cafe interior photo">
        <img src="https://images.unsplash.com/photo-1445116572660-236099ec97a0?auto=format&fit=crop&w=900&q=80" alt="Warm and welcoming cafe interior">
      </button>
      <button class="gallery-item" type="button" aria-label="View latte photo">
        <img src="https://images.unsplash.com/photo-1461023058943-07fcbe16d735?auto=format&fit=crop&w=900&q=80" alt="Latte served in a coffee cup">
      </button>
      <button class="gallery-item" type="button" aria-label="View pastry photo">
        <img src="https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=900&q=80" alt="Freshly baked bread and pastries">
      </button>
      <button class="gallery-item" type="button" aria-label="View coffee making photo">
        <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=900&q=80" alt="Coffee preparation at a cafe">
      </button>
      <button class="gallery-item" type="button" aria-label="View cafe table photo">
        <img src="https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=900&q=80" alt="Cafe tables and relaxing atmosphere">
      </button>
    </section>
  </main>

  <div class="lightbox" id="galleryLightbox" role="dialog"
       aria-modal="true" aria-label="Enlarged gallery image" hidden>
    <button class="lightbox-close" type="button" aria-label="Close image">&times;</button>
    <img src="" alt="" id="lightboxImage">
  </div>

  <footer class="site-footer">
    <p>&copy; 2026 BrewHaus. Made with love and coffee.</p>
  </footer>




</body>
</html>
